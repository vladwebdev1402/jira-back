version: '3.8'

services:
  database:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    env_file:
      - ./.env
    volumes:
      - jira_data:/var/lib/postgres

  backend:
    build: ./
    restart: always
    depends_on:
      - database
    env_file:
      - ./.env
    ports:
      - 5000:5000
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  jira_data:
